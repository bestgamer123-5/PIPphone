plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}

loom {
    mods {
        pipphone {
            sourceSet sourceSets.main
        }
    }
}

repositories {
    mavenCentral()
    maven { url 'https://jitpack.io' }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation project(path: ':carlib', configuration: 'namedElements')
}

processResources {
    inputs.property 'version', project.version

    filesMatching('fabric.mod.json') {
        expand version: project.version,
                minecraft_version: project.minecraft_version,
                loader_version: project.loader_version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

configurations {
    remapper
}

dependencies {
    remapper "net.fabricmc:tiny-remapper:0.10.4"
    remapper "net.fabricmc:mapping-io:0.6.1"
    remapper "org.ow2.asm:asm:9.7.1"
    remapper "org.ow2.asm:asm-tree:9.7.1"
    remapper "org.ow2.asm:asm-commons:9.7.1"
}

def fabricJarFile = layout.buildDirectory.file("libs/${project.archives_base_name}-${project.version}.jar")

def remappedClasspath = files(sourceSets.main.runtimeClasspath, configurations.minecraftClientRuntimeLibraries)

def yarnMappingsFile = configurations.mappings.singleFile

def extractedMappingsFile = layout.buildDirectory.file('tmp/yarn-mappings.tiny')


tasks.register('manualRemapJar', JavaExec) {
    dependsOn(tasks.named('jar'))

    classpath = configurations.remapper
    mainClass.set('net.fabricmc.tinyremapper.Main')

    doFirst {
        def inputJar = tasks.named('jar').get().archiveFile.get().asFile
        def outputJar = fabricJarFile.get().asFile
        def mappingsFile = extractedMappingsFile.get().asFile

        mappingsFile.parentFile.mkdirs()

        new java.util.zip.ZipFile(yarnMappingsFile).withCloseable { zip ->
            def entry = zip.getEntry('mappings/mappings.tiny')
            mappingsFile.withOutputStream { out ->
                zip.getInputStream(entry).transferTo(out)
            }
        }

        outputJar.parentFile.mkdirs()
        args = [
                inputJar.absolutePath,
                outputJar.absolutePath,
                mappingsFile.absolutePath,
                'named',
                'intermediary'
        ] + remappedClasspath.files.collect { it.absolutePath }
    }

    outputs.file(fabricJarFile)
}

tasks.named('remapJar') {
    enabled = false
}

tasks.named('build') {
    dependsOn(tasks.named('manualRemapJar'))
}
